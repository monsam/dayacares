# Deploy @daya/vitals-api to Azure App Service on push to main.
#
# Required GitHub configuration:
# 1. Repository variable AZURE_WEBAPP_NAME — your Azure Web App name (e.g. dayacares-api).
# 2. Repository secret AZURE_WEBAPP_PUBLISH_PROFILE — full publish profile XML from the Azure portal.
#
# Azure App Service settings (Configuration → Application settings):
# - MYSQL_HOST, MYSQL_PORT, MYSQL_USER, MYSQL_PASSWORD, MYSQL_DATABASE
# - DEFAULT_LOGIN_PASSWORD (optional)
# - SNS_* ARNs (optional, for push notifications)

name: Deploy API to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
  NODE_VERSION: "22.x"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Azure configuration
        run: |
          if [ -z "${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}" ]; then
            echo "::error::Missing repository secret AZURE_WEBAPP_PUBLISH_PROFILE."
            echo "Download the publish profile from Azure Portal → your Web App → Overview → Get publish profile,"
            echo "then add it as a repository secret: Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi
          if [ -z "${{ env.AZURE_WEBAPP_NAME }}" ]; then
            echo "::error::Missing repository variable AZURE_WEBAPP_NAME."
            echo "Set it under Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install, build, and test
        run: |
          npm ci --workspace=@daya/vitals-api --workspace=@daya/shared --include-workspace-root
          npm run build -w @daya/vitals-api
          npm test --if-present

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: daya-api
          path: |
            .
            !**/.git
            !apps/mobile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: daya-api

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
          startup-command: npm start
